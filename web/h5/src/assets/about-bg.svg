      <stop offset="0" stop-color="#1b3a63"/>
      <stop offset="0.55" stop-color="#122a4a"/>
      <stop offset="1" stop-color="#0b1c33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.7">
